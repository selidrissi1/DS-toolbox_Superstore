# One-time helper: unpacks superstore-discount.zip into the repository root.
# Delete this file once the project files are in place.
name: unpack-project

on:
  push:
    branches: [main]
    paths: ["superstore-discount.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project into the repository root
        run: |
          unzip -q superstore-discount.zip -d /tmp/unz
          cp -r /tmp/unz/superstore-discount/. .
          git rm -q superstore-discount.zip
          if [ -f "Superstore.csv.csv" ]; then git rm -q "Superstore.csv.csv"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files from superstore-discount.zip"
          git push
